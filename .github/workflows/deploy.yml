# ============================================================
# deploy.yml — main に push すると AWS にデプロイする
# ============================================================
# 1. テスト
# 2. Docker イメージを build → ECR に push (latest と コミットSHA)
# 3. ECS サービスを新イメージで入れ替え (force-new-deployment)
#
# 必要な GitHub Secrets (リポジトリ Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  … ECR push と ECS 更新ができる IAM ユーザー
#   AWS_REGION                                 … 例 ap-northeast-1
# 任意:
#   AWS_ROLE_ARN … OIDC で AssumeRole する場合はこちらを使い、上のキーは不要
#
# 初回だけ手順が前後する: 先に CloudFormation (aws/template.yaml) を DesiredCount=0 で作成し、
# ECR リポジトリができてからこのワークフローを走らせる。 その後 DesiredCount=1 にする。
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

env:
  PROJECT_NAME: snsclub-canva-calendar   # aws/template.yaml の ProjectName と揃える

permissions:
  id-token: write   # OIDC を使う場合
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 認証 (アクセスキー or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: ECR ログイン
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: イメージを build & push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_NAME"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          echo "pushed $IMAGE:latest ($GITHUB_SHA)"

      - name: ECS サービスを新イメージで再デプロイ
        run: |
          aws ecs update-service \
            --cluster "$PROJECT_NAME" \
            --service "$PROJECT_NAME-web" \
            --force-new-deployment \
            --query 'service.{status:status,desired:desiredCount,running:runningCount}' \
            --output table
          echo "※ desiredCount が 0 のときは起動しません。README の手順で 1 にしてください。"
