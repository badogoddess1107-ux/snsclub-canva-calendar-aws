# ============================================================
# deploy.yml — main に push すると AWS にデプロイする
# ============================================================
# 1. テスト
# 2. Docker イメージを build → ECR に push (latest と コミットSHA)
# 3. 完了。 Web UI / 月次バッチは RunTask のたびに :latest を引くので、 次回起動から新イメージになる
#
# 必要な GitHub Secrets (リポジトリ Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  … ECR に push できる IAM ユーザー
#   AWS_REGION                                 … 例 ap-northeast-1
# 任意:
#   AWS_ROLE_ARN … OIDC で AssumeRole する場合はこちらを使い、上のキーは不要
#
# 初回は 先に CloudFormation (aws/template.yaml) を作成して ECR リポジトリを用意してから、
# このワークフローを走らせる (順序が逆だと push 先が無い)。
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

env:
  PROJECT_NAME: snsclub-canva-calendar   # aws/template.yaml の ProjectName と揃える

permissions:
  id-token: write   # OIDC を使う場合
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 認証 (アクセスキー or OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: ECR ログイン
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: イメージを build & push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_NAME"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          echo "pushed $IMAGE:latest ($GITHUB_SHA)"

      - name: 完了
        run: |
          echo "push 完了。 次に起動する Web UI / 月次バッチから新イメージ (:latest) が使われます。"
          echo "※ 常駐サービスは無いため、 今動いているタスクはそのまま (自動停止後の次回起動で切り替わる)。"
